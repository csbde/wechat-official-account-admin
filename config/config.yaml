server:
  port: 9305
  mode: debug
  allow_origins:
    - "*"
  static_dir: "./files"

database:
  # 数据库类型: sqlite (默认) 或 postgres
  # 默认不配置 pgsql 或 host 为空时自动使用 sqlite
  type: sqlite
  sqlite_path: "./data/woaa.db"

  # PostgreSQL 配置 (当 type: postgres 且 host 不为空时启用)
  host: ""
  port: 5432
  user: ""
  password: ""
  dbname: ""
  sslmode: disable
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 3600

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

asynq:
  concurrency: 5

jwt:
  secret: woaa-super-secure-jwt-token-secret-2025
  expire_hours: 72
  issuer: woaa-admin

wechat:
  public_host: ""
  proxy: ""

telemetry:
  service_name: wechat-official-account-admin
  environment: development
  sample_rate: 1.0
