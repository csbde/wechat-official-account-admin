server:
  port: 9305
  mode: debug
  allow_origins:
    - "*"
  static_dir: "./files"

database:
  type: sqlite
  sqlite_path: "./data/woaa.db"
  host: ""
  port: 5432
  user: ""
  password: ""
  dbname: ""
  sslmode: disable
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 3600

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

asynq:
  concurrency: 5

jwt:
  secret: woaa-super-secure-jwt-token-secret-2025
  expire_hours: 72
  issuer: woaa-admin

# OIDC 单点登录配置 (支持 Keycloak / Authing / Okta / Google / CAS / 自建 OIDC 服务)
# 默认按照用户的 email 进行自动匹配与绑定
oidc:
  enabled: true
  issuer: "" # 例如 https://auth.example.com
  client_id: "woaa_client"
  client_secret: "woaa_secret_123"
  redirect_uri: "" # 留空时自动取当前 host/api/auth/oidc/callback
  scopes:
    - openid
    - profile
    - email

wechat:
  public_host: ""
  proxy: ""

telemetry:
  service_name: wechat-official-account-admin
  environment: development
  sample_rate: 1.0
