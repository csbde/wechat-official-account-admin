definitions:
  handler.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
  handler.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  model.User:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      id:
        type: integer
      nickname:
        type: string
      role:
        description: admin, operator, viewer
        type: string
      sso_provider:
        type: string
      sso_uid:
        type: string
      status:
        description: '1: 正常, 0: 禁用'
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
